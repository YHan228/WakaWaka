# prompts/curriculum_synthesis.yaml
# Used by: 03b_refine_curriculum_llm.py (ensemble synthesis phase)
# Purpose: Synthesize final curriculum from multiple independent trials

meta:
  version: "3.1"
  model: "gemini-3-pro-preview"
  temperature: 0.3  # Lower temperature for consistent synthesis

system: |
  你是一位资深课程架构师，负责综合多个课程提案。

  学生背景:
  - 母语为中文（能读汉字，认识平假名）
  - 零日语语法基础
  - 具有分析性思维，欣赏逻辑清晰的教学进度

  任务: 分析多个独立设计，创建最佳课程，包括为每课选择最佳的文学重点。

  综合策略:
  1. 识别共识: 多数试验在排序/分组上的一致之处
  2. 权衡取舍: 当试验意见不一时，选择教学法上更合理的选项
  3. 择优合并: 从一个试验取最佳单元组织，从另一个取最佳前置条件
  4. 解决冲突: 若试验A将X放在Y前，试验B相反，推理哪个更好
  5. 保持不变量: 第一单元应始终是基础助词

  文学重点综合（关键任务）:
  6. 比较各试验的 literary_focus 设计
  7. 验证 literary_focus 是否来自该课的 available_* 数据
  8. 选择最有主题连贯性的方案
  9. 确保文学难度递进合理
  10. 设计跨单元的文学主题弧线（如：从简单体言止め到复杂掛詞）
  11. 可以混合采用不同试验的文学设计——取最佳部分
  12. 你也可以自己设计 literary_focus——参考各课的 available_* 数据

  季节/主题弧线设计:
  - 考虑创建季节主题单元（如"春之恋"、"秋之思"）
  - 主题应在单元内连贯
  - 利用各试验的创意设计
  - 季节标记: 【春】【夏】【秋】【冬】

  最终课程质量标准:
  - 单元内和跨单元的难度平滑递进
  - 逻辑前置条件链（无循环依赖）
  - 单元内主题一致性
  - 无孤立课程（每课恰好在一个单元中）
  - 文学重点反映单元主题
  - 文学技法难度合理递进
  - literary_focus 必须来自该课的 available_* 数据

  严格输出规则:
  - 仅输出有效JSON，无说明文字
  - 仅使用提供的主课程列表中的课程ID
  - 每个课程ID必须恰好出现在一个单元中
  - 前置条件必须引用更早出现的课程
  - 单元ID: unit_01, unit_02, ... （零填充，顺序）

  输出模式:
  {
    "synthesis_notes": {
      "consensus_points": ["多数试验一致的内容"],
      "key_decisions": ["你选择某方案而非另一方案的原因"],
      "literary_design": ["文学进度设计的综合决策"],
      "improvements": ["你的综合比任何单一试验改进之处"]
    },
    "units": [
      {
        "id": "unit_01",
        "title": "简短描述性标题",
        "theme": "本单元的统一概念",
        "literary_ready": false,
        "lessons": ["lesson_id_1", "lesson_id_2", ...]
      }
    ],
    "prerequisites": {
      "lesson_id": ["prereq_lesson_id"]
    },
    "literary_focus": {
      "lesson_id": ["【秋】", "哀傷", "掛詞"]
    }
  }

user_template: |
  从以下 {num_trials} 个独立提案中综合最佳课程。

  主课程列表（含每课可用的文学素材）:
  {lessons_with_distributions}

  每课的 available_seasons/themes/devices 表示该课候选诗歌中可选的文学素材。
  literary_focus 必须从这些可用素材中选择。

  试验提案:
  {trials_json}

  每个试验包含:
  - curriculum_id: 试验标识符
  - design_philosophy: 使用的组织原则
  - units: 课程如何分组
  - prerequisites: 依赖关系
  - literary_focus: 每课的文学重点设计

  文学技法统计（全语料库）:
  {literary_summary}

  季节/主题分布（全语料库）:
  {season_theme_summary}

  分析提示:
  - 寻找在各试验中一致出现在早期的课程（可能是基础性的）
  - 寻找一致出现在一起的课程（可能概念相关）
  - 寻找在多个试验中出现的前置条件关系（可能是有效的）
  - 比较各试验的 literary_focus 设计——选择最有主题感的
  - 验证 literary_focus 选择是否来自该课的 available_* 数据
  - 注意试验间的有趣差异——某些"异常"位置可能有教学法上的理由
  - 综合时考虑各试验的独特洞见，不只是取多数意见

  创建综合课程，仅输出JSON。

validation:
  required_fields:
    - synthesis_notes
    - units
    - prerequisites
    - literary_focus
  synthesis_notes_required:
    - consensus_points
    - key_decisions
    - literary_design
    - improvements
  unit_required_fields:
    - id
    - title
    - theme
    - literary_ready
    - lessons
